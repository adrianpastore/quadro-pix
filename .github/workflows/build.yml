# Recompila dist/ sempre que o código-fonte muda na main, para que editar
# src/app.jsx direto pelo GitHub continue funcionando sem rodar nada local.
name: Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "tailwind.config.js"
      - "package.json"
      - "package-lock.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commitar dist/ atualizado
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- dist; then
            echo "dist/ já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Recompila dist/"
          git push
